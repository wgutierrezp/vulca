<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Radiancia Goes</title>
  <style>
    :root{
      --gap:16px;
      --card-bg:#fff;
      --card-radius:6px;
      --card-shadow:0 1px 3px rgba(0,0,0,0.04);
    }
    body{
      font-family: Arial, sans-serif;
      margin:16px;
      background:#f5f5f5;
      color:#111;
    }
    h1{margin:0 0 12px 0;font-size:1.25rem}
    .stack{
      display:flex;
      flex-direction:column;
      gap:var(--gap);
      align-items:stretch;
    }
    .card{
      background:var(--card-bg);
      border-radius:var(--card-radius);
      box-shadow:var(--card-shadow);
      padding:12px;
      border:1px solid #e6e6e6;
    }
    .card h3{margin:0 0 8px 0;font-size:1rem}
    /* Contenedor responsivo para el iframe: mantiene aspecto 16:9 basado en ancho,
       pero si el contenido interno es accesible (mismo origen) se sobrescribe por JS. */
    .embed-wrap{
      width:100%;
      position:relative;
      padding-top:56.25%; /* 16:9 ratio */
      overflow:hidden;
      border-radius:6px;
      background:#fff;
    }
    .embed-wrap iframe{
      position:absolute;
      top:0; left:0;
      width:100%;
      height:100%;
      border:0;
    }

    /* Ajustes para pantallas pequeñas */
    @media (max-width:420px){
      body{margin:10px}
      .card{padding:10px}
    }
  </style>
</head>
<body>
  <h1>Radiancia Goes</h1>

  <div class="stack">
    <div class="card">
      <div class="embed-wrap"><iframe id="frame1" src="Fuego.html" title="Serie 1"></iframe></div>
    </div>

    <div class="card">
      <div class="embed-wrap"><iframe id="frame2" src="Pacaya.html" title="Serie 2"></iframe></div>
    </div>

    <div class="card">
      <div class="embed-wrap"><iframe id="frame3" src="Santiaguito.html" title="Serie 3"></iframe></div>
    </div>
  </div>

  <script>
    // Ajusta la altura del iframe al contenido (solo funciona si los HTML están en el mismo origen)
    function ajustarAltura(frame){
      try{
        const doc = frame.contentDocument || frame.contentWindow.document;
        const h = Math.max(240, doc.documentElement.scrollHeight, doc.body.scrollHeight);
        // quitar estilos posicion absolute de embed-wrap para permitir altura natural
        const wrap = frame.parentElement;
        wrap.style.paddingTop = '0';
        frame.style.position = 'static';
        frame.style.width = '100%';
        frame.style.height = h + 'px';
      }catch(e){
        // cross-origin: dejamos el ratio 16:9
        console.warn('No se pudo ajustar altura (cross-origin?)', frame.id);
      }
    }

    ['frame1','frame2','frame3'].forEach(id=>{
      const f = document.getElementById(id);
      f.addEventListener('load', ()=> ajustarAltura(f));
      // re-ajustar si la ventana cambia de ancho (intenta recalcular si mismo origen)
      window.addEventListener('resize', ()=> {
        // reestablecer a ratio 16:9 antes de intentar reajustar
        const wrap = f.parentElement;
        wrap.style.paddingTop = '56.25%';
        f.style.position = 'absolute';
        f.style.height = '';
        ajustarAltura(f);
      });
    });
  </script>
</body>
</html>
